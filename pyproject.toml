[project]
name = "secsai-group-6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "erikhrina", email = "e.hrina@tilburguniversity.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "tldextract>=5.3.2",
    "seaborn>=0.13.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "python-levenshtein>=0.27.5",
    "pika>=1.4.4",
]

[project.scripts]
secsai-group-6 = "secsai_group_6:main"
secsai = "secsai_group_6.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gdown>=6.4.0",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
