name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Test Python suite
        run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension outage handling
        run: node --test tests/extension_failure.test.cjs
