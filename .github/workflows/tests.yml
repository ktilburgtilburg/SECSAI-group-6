name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Test Python suite
        run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension outage handling
        run: node --test tests/extension_failure.test.cjs

  composed-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - name: Start disposable composed system
        run: |
          docker compose -f compose.test.yaml up -d --build --scale worker=3
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); from verify_system import wait_ready; wait_ready()"
      - name: Live contract and persisted feedback
        run: uv run pytest -m integration --system-url http://127.0.0.1:5000
      - name: Compare worker counts and inject failures
        run: uv run python scripts/verify_system.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-results
          path: docs/system-results/
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -f compose.test.yaml logs
          docker compose -f compose.test.yaml down -v
